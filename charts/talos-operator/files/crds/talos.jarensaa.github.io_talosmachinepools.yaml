              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosMachinePoolSpec defines the desired state of TalosMachinePool.
            properties:
              clusterRef:
                description: ClusterRef names the TalosCluster in the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
