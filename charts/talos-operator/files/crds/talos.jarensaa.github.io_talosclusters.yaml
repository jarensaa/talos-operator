---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: talosclusters.talos.jarensaa.github.io
spec:
  group: talos.jarensaa.github.io
  names:
    kind: TalosCluster
    listKind: TalosClusterList
    plural: talosclusters
    shortNames:
    - tc
    singular: taloscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.versions.talos
      name: Talos
      type: string
    - jsonPath: .status.observed.kubernetesVersion
      name: Kubernetes
      type: string
    - jsonPath: .status.conditions[?(@.type=="ConfigProven")].status
      name: Proven
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TalosCluster is a Talos Linux cluster managed (or observed) by
          the operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TalosClusterSpec defines the desired state of TalosCluster.
            properties:
              clusterName:
                description: ClusterName is the Talos/Kubernetes cluster name. Optional
                  while observing; immutable once set.
                type: string
              config:
                description: Config is the cluster-wide layer, applied to every machine
                  before its pool's and its own.
                items:
                  description: |-
                    ConfigSource is one entry of a config layer: config documents (multi-document YAML) merged onto
                    the generated config with strategic merge (docs/scope.md §5). Documents of the multi-document
                    kinds are declared whole; the legacy v1alpha1 document is a partial overlay. JSON6902 patches are
                    refused: they cannot address multi-document configs. Exactly one source is set, and a layer
                    holds at most 32 entries (MaxItems) so the CEL validation cost stays within the API server
                    budget.
                  properties:
                    configRef:
                      description: ConfigRef uses the documents of a TalosMachineConfig,
                        so they can be shared.
                      properties:
                        name:
                          description: Name of the TalosMachineConfig.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    inline:
                      description: Inline config documents.
                      maxLength: 262144
                      type: string
                    secretKeyRef:
                      description: |-
                        SecretKeyRef reads documents from a Secret key, for documents that carry sensitive values.
                        The key is required. Diffs of the documents it sets are withheld from status.
                      properties:
                        key:
                          description: Key within the Secret. Each referencing field
                            documents its default.
                          type: string
                        name:
                          description: Name of the Secret.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of inline, configRef or secretKeyRef must
                      be set
                    rule: '(has(self.inline) ? 1 : 0) + (has(self.configRef) ? 1 :
                      0) + (has(self.secretKeyRef) ? 1 : 0) == 1'
                  - message: secretKeyRef.key is required for config
                    rule: '!has(self.secretKeyRef) || has(self.secretKeyRef.key)'
                maxItems: 32
                type: array
              configGeneration:
                description: ConfigGeneration holds the base config generation inputs.
                properties:
                  installer:
                    description: Installer is the default installer; a pool may override
                      its schematic.
                    properties:
                      factoryURL:
                        default: https://factory.talos.dev
                        description: FactoryURL is the Image Factory base URL.
                        pattern: ^https://
                        type: string
                      platform:
                        default: metal
                        description: Platform of the installer image, e.g. metal.
                        type: string
                      schematicID:
                        description: SchematicID is the Image Factory schematic ID
                          (64 hex characters).
                        pattern: ^[0-9a-f]{64}$
                        type: string
                    type: object
                  options:
                    description: Options for config generation.
                    properties:
                      dnsDomain:
                        description: DNSDomain of the cluster.
                        type: string
                      kubePrismPort:
                        description: KubePrismPort is the KubePrism listen port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      podSubnets:
                        description: PodSubnets are the pod CIDRs.
                        items:
                          type: string
                        type: array
                      serviceSubnets:
                        description: ServiceSubnets are the service CIDRs.
                        items:
                          type: string
                        type: array
                    type: object
                  versionContract:
                    description: |-
                      VersionContract pins the machine config contract, e.g. v1.14. It is never implied from the
                      operator's machinery version, so a newer operator cannot silently change generated defaults.
                    pattern: ^v\d+\.\d+$
                    type: string
                type: object
              controlPlaneEndpoint:
                description: ControlPlaneEndpoint is the Kubernetes API endpoint.
                  Optional while observing; immutable once set.
                pattern: ^https://
                type: string
              credentials:
                default:
                  source: TalosServiceAccount
                description: |-
                  Credentials selects how the operator authenticates to the Talos API (docs/scope.md §9).
                  By default Talos issues the operator's certificate.
                properties:
                  secretRef:
                    description: |-
                      SecretRef points to a Secret holding an admin talosconfig (key defaults to "talosconfig").
                      Only for source Secret.
                    properties:
                      key:
                        description: Key within the Secret. Each referencing field
                          documents its default.
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  source:
                    default: TalosServiceAccount
                    description: Source is TalosServiceAccount (default) or Secret.
                    enum:
                    - TalosServiceAccount
                    - Secret
                    type: string
                type: object
                x-kubernetes-validations:
                - message: secretRef is required for source Secret and not allowed
                    otherwise
                  rule: (has(self.source) && self.source == 'Secret') == has(self.secretRef)
              management:
                default: {}
                description: Management enables operator capabilities. Defaults to
                  observe-only.
                properties:
                  config:
                    default: Observe
                    description: Config is Observe (read-only) or Manage (the operator
                      owns the rendered machine config).
                    enum:
                    - Observe
                    - Manage
                    type: string
                  membership:
                    default: Disabled
                    description: Membership enables adding, removing and replacing
                      machines.
                    enum:
                    - Disabled
                    - Enabled
                    type: string
                  upgrades:
                    default: Disabled
                    description: Upgrades enables Talos and Kubernetes version rollouts.
                    enum:
                    - Disabled
                    - Enabled
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'upgrades can be Enabled only with config: Manage'
                  rule: '!has(self.upgrades) || self.upgrades != ''Enabled'' || (has(self.config)
                    && self.config == ''Manage'')'
                - message: 'membership can be Enabled only with config: Manage'
                  rule: '!has(self.membership) || self.membership != ''Enabled'' ||
                    (has(self.config) && self.config == ''Manage'')'
              paused:
                description: Paused stops all mutating actions immediately.
                type: boolean
              rollout:
                default: {}
                description: Rollout tunes how config changes are applied once config
                  is Manage.
                properties:
                  drainTimeout:
                    description: |-
                      DrainTimeout bounds the eviction of a node's pods before an upgrade reboots it. Evictions
                      respect PodDisruptionBudgets, so a budget that never lets a pod go ends here. Defaults to
                      10m. A node that is not drained in time halts the upgrade and stays cordoned.
                    type: string
                  driftPolicy:
                    default: Report
                    description: DriftPolicy is Report (default) or Enforce.
                    enum:
                    - Report
                    - Enforce
                    type: string
                  gates:
                    description: |-
                      Gates are conditions on objects in the cluster that must hold before a node is touched and
                      while a changed node is verified, next to the cluster's own health (docs/scope.md §6.4).
                    items:
                      description: |-
                        RolloutGate is a condition on one object in the cluster. The operator needs permission to get
                        the object; the chart grants what its gates.rules value lists.
                      properties:
                        expression:
                          description: |-
                            Expression is a CEL expression over the object, as "object". The gate is open only while it
                            evaluates to true, e.g. object.status.ceph.health == "HEALTH_OK". An object that does not
                            exist, a field that is not there, or anything but a boolean closes the gate.
                          maxLength: 1024
                          minLength: 1
                          type: string
                        name:
                          description: Name of the gate, used in conditions.
                          maxLength: 63
                          minLength: 1
                          type: string
                        object:
                          description: Object is what the gate asks about.
                          properties:
                            apiVersion:
                              description: APIVersion of the object, e.g. ceph.rook.io/v1.
                              minLength: 1
                              type: string
                            kind:
                              description: Kind of the object, e.g. CephCluster.
                              minLength: 1
                              type: string
                            name:
                              description: Name of the object.
                              minLength: 1
                              type: string
                            namespace:
                              description: Namespace of the object; empty for a cluster-scoped
                                one.
                              type: string
                          required:
                          - apiVersion
                          - kind
                          - name
                          type: object
                      required:
                      - expression
                      - name
                      - object
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  hooks:
                    description: Hooks are Jobs run around an operation and around
                      each node's turn (docs/scope.md §6.4).
                    properties:
                      postNode:
                        description: PostNode runs after a node was verified. A node
                          that failed gets none.
                        items:
                          description: Hook is a Job the operator runs and waits for.
                          properties:
                            job:
                              description: |-
                                Job is a batch/v1 JobSpec. The operator creates the Job in the TalosCluster's namespace and
                                adds the environment variables TALOS_CLUSTER, TALOS_OPERATION, TALOS_OPERATION_ID,
                                TALOS_HOOK and, for a node's hooks, TALOS_MACHINE and TALOS_NODE to every container. It sets
                                restartPolicy Never and backoffLimit 0 where the spec leaves them open. The spec is not
                                validated before the Job is created: one the API server refuses fails the hook.
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            name:
                              description: Name of the hook, used in the Job's name
                                and in conditions.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,22}[a-z0-9])?$
                              type: string
                            timeout:
                              description: |-
                                Timeout is how long the Job may take. A Job that has not succeeded by then fails the hook,
                                which halts the operation. Defaults to spec.rollout.stepTimeout.
                              type: string
                          required:
                          - job
                          - name
                          type: object
                        maxItems: 8
                        type: array
                      postRollout:
                        description: PostRollout runs when an operation that ran its
                          preRollout hooks ends, however it ends.
                        items:
                          description: Hook is a Job the operator runs and waits for.
                          properties:
                            job:
                              description: |-
                                Job is a batch/v1 JobSpec. The operator creates the Job in the TalosCluster's namespace and
                                adds the environment variables TALOS_CLUSTER, TALOS_OPERATION, TALOS_OPERATION_ID,
                                TALOS_HOOK and, for a node's hooks, TALOS_MACHINE and TALOS_NODE to every container. It sets
                                restartPolicy Never and backoffLimit 0 where the spec leaves them open. The spec is not
                                validated before the Job is created: one the API server refuses fails the hook.
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            name:
                              description: Name of the hook, used in the Job's name
                                and in conditions.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,22}[a-z0-9])?$
                              type: string
                            timeout:
                              description: |-
                                Timeout is how long the Job may take. A Job that has not succeeded by then fails the hook,
                                which halts the operation. Defaults to spec.rollout.stepTimeout.
                              type: string
                          required:
                          - job
                          - name
                          type: object
                        maxItems: 8
                        type: array
                      preNode:
                        description: |-
                          PreNode runs when a node's turn comes, before anything is sent to it. A Kubernetes upgrade
                          takes no node out of the cluster and runs no node hooks.
                        items:
                          description: Hook is a Job the operator runs and waits for.
                          properties:
                            job:
                              description: |-
                                Job is a batch/v1 JobSpec. The operator creates the Job in the TalosCluster's namespace and
                                adds the environment variables TALOS_CLUSTER, TALOS_OPERATION, TALOS_OPERATION_ID,
                                TALOS_HOOK and, for a node's hooks, TALOS_MACHINE and TALOS_NODE to every container. It sets
                                restartPolicy Never and backoffLimit 0 where the spec leaves them open. The spec is not
                                validated before the Job is created: one the API server refuses fails the hook.
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            name:
                              description: Name of the hook, used in the Job's name
                                and in conditions.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,22}[a-z0-9])?$
                              type: string
                            timeout:
                              description: |-
                                Timeout is how long the Job may take. A Job that has not succeeded by then fails the hook,
                                which halts the operation. Defaults to spec.rollout.stepTimeout.
                              type: string
                          required:
                          - job
                          - name
                          type: object
                        maxItems: 8
                        type: array
                      preRollout:
                        description: PreRollout runs after an operation took the lock,
                          before its first node.
                        items:
                          description: Hook is a Job the operator runs and waits for.
                          properties:
                            job:
                              description: |-
                                Job is a batch/v1 JobSpec. The operator creates the Job in the TalosCluster's namespace and
                                adds the environment variables TALOS_CLUSTER, TALOS_OPERATION, TALOS_OPERATION_ID,
                                TALOS_HOOK and, for a node's hooks, TALOS_MACHINE and TALOS_NODE to every container. It sets
                                restartPolicy Never and backoffLimit 0 where the spec leaves them open. The spec is not
                                validated before the Job is created: one the API server refuses fails the hook.
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                            name:
                              description: Name of the hook, used in the Job's name
                                and in conditions.
                              pattern: ^[a-z0-9]([-a-z0-9]{0,22}[a-z0-9])?$
                              type: string
                            timeout:
                              description: |-
                                Timeout is how long the Job may take. A Job that has not succeeded by then fails the hook,
                                which halts the operation. Defaults to spec.rollout.stepTimeout.
                              type: string
                          required:
                          - job
                          - name
                          type: object
                        maxItems: 8
                        type: array
                    type: object
                  maintenanceWindows:
                    description: |-
                      MaintenanceWindows are the times at which an operation may start, and may begin another node
                      (docs/scope.md §6.4). With none, any time is allowed. A node that is being changed when a
                      window closes is finished.
                    items:
                      description: MaintenanceWindow is a recurring time at which
                        nodes may be changed.
                      properties:
                        duration:
                          description: Duration is how long the window stays open.
                          type: string
                        schedule:
                          description: |-
                            Schedule is when the window opens, as a cron expression of five fields: minute, hour, day of
                            month, month, day of week. For example "0 2 * * 6" is Saturdays at 02:00.
                          maxLength: 128
                          pattern: ^\S+(\s+\S+){4}$
                          type: string
                        timeZone:
                          description: TimeZone is the IANA time zone the schedule
                            is read in, e.g. Europe/Oslo. UTC if empty.
                          maxLength: 64
                          type: string
                      required:
                      - duration
                      - schedule
                      type: object
                      x-kubernetes-validations:
                      - message: duration must be positive
                        rule: duration(self.duration) > duration('0s')
                    maxItems: 16
                    type: array
                  soak:
                    description: |-
                      Soak is how long a node must stay healthy under a new config before it is confirmed and the
                      rollout moves on. Defaults to 2m.
                    type: string
                  stepTimeout:
                    description: |-
                      StepTimeout bounds every other wait of a node step: for the cluster to be healthy before the
                      node is touched, and for the node to come back after a try ended unconfirmed.
                      Defaults to 10m. A timeout is a failure, never a skip.
                    type: string
                  tryTimeout:
                    description: |-
                      TryTimeout is how long Talos keeps a config applied in try mode before reverting it by
                      itself. Every change is applied that way. The operator must verify the node from outside,
                      soak, and confirm within it. Defaults to 5m; it must exceed soak by at least two minutes.
                    type: string
                type: object
                x-kubernetes-validations:
                - message: soak must not be negative
                  rule: 'duration(has(self.soak) ? self.soak : ''2m'') >= duration(''0s'')'
                - message: tryTimeout must exceed soak by at least 2m, or a tried
                    config could never be confirmed
                  rule: 'duration(has(self.tryTimeout) ? self.tryTimeout : ''5m'')
                    >= duration(has(self.soak) ? self.soak : ''2m'') + duration(''2m'')'
                - message: stepTimeout must exceed soak
                  rule: 'duration(has(self.stepTimeout) ? self.stepTimeout : ''10m'')
                    > duration(has(self.soak) ? self.soak : ''2m'')'
              secretsRef:
                description: |-
                  SecretsRef points to a Secret holding the cluster secrets bundle (key defaults to "secrets.yaml";
                  the Secret defaults to "<name>-talos-secrets").
                  During adoption the operator writes it if absent and verifies it if present.
                properties:
                  key:
                    description: Key within the Secret. Each referencing field documents
                      its default.
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              versions:
                description: Versions are the desired Talos and Kubernetes versions.
                properties:
                  kubernetes:
                    description: Kubernetes version, e.g. 1.37.1.
                    pattern: ^\d+\.\d+\.\d+$
                    type: string
                  talos:
                    description: Talos version, e.g. v1.14.2.
                    pattern: ^v\d+\.\d+\.\d+$
                    type: string
                type: object
            type: object
            x-kubernetes-validations:
            - message: clusterName is immutable once set
              rule: '!has(oldSelf.clusterName) || (has(self.clusterName) && self.clusterName
                == oldSelf.clusterName)'
            - message: controlPlaneEndpoint is immutable once set
              rule: '!has(oldSelf.controlPlaneEndpoint) || (has(self.controlPlaneEndpoint)
                && self.controlPlaneEndpoint == oldSelf.controlPlaneEndpoint)'
          status:
            description: TalosClusterStatus defines the observed state of TalosCluster.
            properties:
              abortedTargets:
                additionalProperties:
                  type: string
                description: |-
                  AbortedTargets is what the operation a human aborted was rolling out: machine name to
                  rendered config hash. Those configs are not rolled out to those machines again; a spec that
                  renders anything else, a revert included, rolls out and clears this.
                type: object
              adoption:
                description: Adoption tracks adoption progress.
                properties:
                  adoptedAt:
                    description: |-
                      AdoptedAt is when the cluster was first proven. From then on the operator never writes the
                      TalosCluster's spec, a TalosMachinePool or a TalosMachine again; nothing unsets it.
                    format: date-time
                    type: string
                  liveConfigHashes:
                    additionalProperties:
                      type: string
                    description: LiveConfigHashes maps TalosMachine name to the hash
                      of the live config proven at adoption.
                    type: object
                  notes:
                    description: |-
                      Notes are facts about the live cluster worth knowing when taking the resources over, such
                      as a node whose Talos version differs from the one its config installs.
                    items:
                      type: string
                    type: array
                  preconditions:
                    description: Preconditions that must hold before adoption can
                      be proven.
                    items:
                      description: Precondition is one named adoption precondition.
                      properties:
                        message:
                          description: Message explains a False or Unknown status.
                          type: string
                        name:
                          description: Name of the precondition, e.g. EtcdHealthy.
                          type: string
                        status:
                          description: Status is True, False or Unknown.
                          type: string
                      required:
                      - name
                      - status
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  provenAt:
                    description: ProvenAt is when the no-changes proof last succeeded.
                    format: date-time
                    type: string
                  source:
                    description: |-
                      Source fingerprints the live state the resources were last derived from, so they are
                      derived again only when the cluster changes.
                    type: string
                  unmatchedMembers:
                    description: UnmatchedMembers lists live members (by hostname)
                      that no TalosMachine claims.
                    items:
                      type: string
                    type: array
                type: object
              approval:
                description: Approval is the change waiting for a human's approval,
                  if any.
                properties:
                  hash:
                    description: |-
                      Hash identifies exactly this change: the machines and their current and rendered config
                      hashes. Annotate the TalosCluster with talos.jarensaa.github.io/approve-diff=<hash> to approve
                      it; the approval cannot be replayed onto a different change.
                    type: string
                  machines:
                    description: |-
                      Machines lists the machines whose change needs approval, with the reason. Each machine's
                      status.config.diff shows its redacted diff.
                    items:
                      type: string
                    type: array
                required:
                - hash
                type: object
              conditions:
                description: Conditions represent the latest observations of the cluster.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              history:
                description: History holds the most recent finished operations, newest
                  first.
                items:
                  description: OperationRecord is a finished operation, kept for the
                    record.
                  properties:
                    completed:
                      items:
                        type: string
                      type: array
                    finishedAt:
                      format: date-time
                      type: string
                    id:
                      type: string
                    message:
                      type: string
                    outcome:
                      description: Outcome is Succeeded, Aborted or Superseded.
                      type: string
                    skipped:
                      items:
                        type: string
                      type: array
                    startedAt:
                      format: date-time
                      type: string
                    type:
                      description: OperationType is the kind of disruptive operation
                        holding the cluster lock.
                      enum:
                      - ConfigRollout
                      - TalosUpgrade
                      - KubernetesUpgrade
                      - AddControlPlane
                      - RemoveMachine
                      - Bootstrap
                      type: string
                  required:
                  - finishedAt
                  - id
                  - outcome
                  - startedAt
                  - type
                  type: object
                maxItems: 10
                type: array
              observed:
                description: Observed is the last observed live state.
                properties:
                  etcdMembers:
                    description: EtcdMembers is the observed etcd membership.
                    items:
                      description: EtcdMember is one observed etcd member.
                      properties:
                        hostname:
                          description: Hostname of the member.
                          type: string
                        id:
                          description: ID is the etcd member ID in hex.
                          type: string
                        isLearner:
                          description: IsLearner is true while the member is not yet
                            a voter.
                          type: boolean
                      required:
                      - hostname
                      - id
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
