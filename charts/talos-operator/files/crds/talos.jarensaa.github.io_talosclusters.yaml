                    type: string
                  talosVersions:
                    additionalProperties:
                      format: int32
                      type: integer
                    description: TalosVersions counts nodes per running Talos version.
                    type: object
                type: object
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
