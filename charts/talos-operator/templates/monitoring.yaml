{{- $monitoring := .Values.monitoring -}}
{{- if include "talos-operator.monitoring" (dict "ctx" . "name" "monitoring.serviceMonitor.enabled" "setting" $monitoring.serviceMonitor.enabled) }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "talos-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos-operator.labels" . | nindent 4 }}
    {{- with $monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "talos-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    # The endpoint asks the Kubernetes API who the scraper is and whether it may read /metrics,
    # and serves a certificate it signed itself unless it is given one.
    - port: metrics
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      {{- with $monitoring.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
{{- end }}
{{- if include "talos-operator.monitoring" (dict "ctx" . "name" "monitoring.alerts.enabled" "setting" $monitoring.alerts.enabled) }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "talos-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos-operator.labels" . | nindent 4 }}
    {{- with $monitoring.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yaml" | fromYaml | toYaml | nindent 2 }}
{{- end }}
{{- if include "talos-operator.monitoring" (dict "ctx" . "name" "monitoring.dashboard.enabled" "setting" $monitoring.dashboard.enabled) }}
---
# Grafana's sidecar, as kube-prometheus-stack runs it, loads every ConfigMap with this label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "talos-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "talos-operator.labels" . | nindent 4 }}
    {{- toYaml $monitoring.dashboard.labels | nindent 4 }}
  {{- with $monitoring.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # What the operator does: operations, drift, versions, machines.
  talos-operator.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
  # What Talos says about the nodes: services, clocks, links, volumes, etcd, certificates.
  talos-nodes.json: |-
    {{- .Files.Get "files/dashboard-nodes.json" | nindent 4 }}
{{- end }}
