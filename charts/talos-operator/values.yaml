# Default values for talos-operator.

# Override the name of the chart.
nameOverride: ""
# Override the full name of the chart.
fullnameOverride: ""

# Two replicas with leader election: when a rollout drains the leader's node, the standby on
# another node takes over and resumes from persisted status (docs/scope.md §4.2).
replicas: 2

image:
  repository: ghcr.io/jarensaa/talos-operator
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Extra manager flags. Logs are JSON at info level; ["--zap-devel"] switches to the development
# format with debug output, ["--zap-log-level=debug"] only raises the level.
extraArgs: []

resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the chart full name.
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Replicas never share a node, so one node drain cannot take out both.
# Set to "preferred" for single-node test clusters.
podAntiAffinity: required

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

nodeSelector: {}
# The operator manages the cluster it runs on, and has to keep running on one that has no workers.
# Talos taints its control planes unless scheduling on them is allowed, so the taint is tolerated.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

metrics:
  # Serve metrics over HTTPS on 8443, authenticated via the Kubernetes API.
  enabled: true

# What exists upstream. Off by default: the operator then talks to nothing but the cluster it
# manages, and a release that does not exist is found when the first node fails to pull it, before
# anything on that node is changed. Switched on, a TalosCluster's status lists the Talos and
# Kubernetes releases that are available, a Kubernetes upgrade over several minors goes through the
# newest release of each, and an upgrade to an installer or an image that does not exist is refused
# before a node is asked to pull it. For that the operator asks the Image Factory a TalosCluster's
# installer names (GET /versions, the schematic, the installer's manifest), the Kubernetes release
# site and the registries of the Kubernetes images: over HTTPS, a few times a day, and never during
# an upgrade. Nothing is upgraded because of what they answer. These are other people's services:
# switching this on is a decision to use them (docs/guide.md).
versionSources:
  enabled: false
  # Where Kubernetes publishes its releases; https://dl.k8s.io if empty.
  kubernetesReleases: ""

# Gates (spec.rollout.gates on a TalosCluster) are conditions on objects in the cluster, such as a
# storage cluster's health. The operator reads a gate's object with its own ServiceAccount and may
# read nothing it is not granted here: one rule for every kind a gate names, with the verb get.
gates:
  rules: []
  # - apiGroups: ["ceph.rook.io"]
  #   resources: ["cephclusters"]
  #   verbs: ["get"]

crds:
  # The CustomResourceDefinitions are part of the release, so `helm upgrade` upgrades them
  # (docs/scope.md §12.15). Disable only if they are installed some other way.
  enabled: true
  # Leave the CRDs in place when the chart is uninstalled. Deleting a CRD deletes every object
  # of its kind: every TalosCluster, pool and machine.
  keep: true

admissionPolicies:
  # ValidatingAdmissionPolicies guarding the management gate and TalosMachine deletion
  # (docs/scope.md §5.2). Disable only if they are installed some other way.
  enabled: true
