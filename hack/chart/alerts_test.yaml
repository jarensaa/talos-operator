  name: a config rollout halted at a node that rolled back
- alert_rule_test:
  - alertname: TalosOperatorDown
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosOperatorCannotReadState
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosClusterNotObserved
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosOperationHalted
    eval_time: 2h
    exp_alerts:
    - exp_annotations:
        description: 'The ConfigRollout of my-cluster is halted at Verifying on node-a
          (RolledBack). It holds the cluster until someone retries it, skips the machine
          or aborts it: status.operation.failure of the TalosCluster says what happened
          and what to do.'
        summary: A ConfigRollout of my-cluster has failed and waits for a person.
      exp_labels:
        machine: node-a
        namespace: talos-operator
        reason: RolledBack
        severity: critical
        step: Verifying
        taloscluster: my-cluster
        type: ConfigRollout
  - alertname: TalosRolloutBlocked
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosConfigDrift
    eval_time: 2h
    exp_alerts: []
