  - alertname: TalosCertificateExpiring
    eval_time: 2h
    exp_alerts:
    - exp_annotations:
        description: Less than a tenth of the validity of the operator certificate
          of my-cluster is left. The operator's own certificate is renewed by Talos,
          or replaced by whoever supplied it; an authority that ends takes the cluster
          with it, and replacing one is a rotation of the cluster's PKI.
        summary: The operator certificate of my-cluster is close to its end.
      exp_labels:
        certificate: operator
        namespace: talos-operator
        severity: warning
        taloscluster: my-cluster
  - alertname: TalosCertificateExpired
    eval_time: 2h
    exp_alerts:
    - exp_annotations:
        description: The operator certificate of my-cluster has reached the end of
          its validity. Without its own certificate the operator reaches no node;
          without an authority nothing in the cluster trusts anything.
        summary: The operator certificate of my-cluster is no longer valid.
      exp_labels:
        certificate: operator
        namespace: talos-operator
        severity: critical
        taloscluster: my-cluster
