    eval_time: 2h
    exp_alerts: []
  - alertname: TalosVersionsUnreachable
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosInstallerNotBootable
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosAPIUnreachable
    eval_time: 2h
    exp_alerts:
    - exp_annotations:
        description: 'The operator has had no working connection to the Talos API
          of my-cluster for 10 minutes: Unreachable. It observes nothing and rolls
          out nothing until it has one.'
        summary: talos-operator cannot talk to the Talos API of my-cluster.
      exp_labels:
        namespace: talos-operator
        reason: Unreachable
        severity: critical
        taloscluster: my-cluster
  - alertname: TalosClusterUnhealthy
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosMachineNotObserved
    eval_time: 2h
    exp_alerts:
    - exp_annotations:
        description: 'The operator has not been able to read the node of node-a in
          my-cluster for 10 minutes. What is not read is not known: no other node
          is touched while it lasts.'
        summary: talos-operator cannot read node-a.
      exp_labels:
        machine: node-a
        namespace: talos-operator
        severity: warning
        taloscluster: my-cluster
    - exp_annotations:
        description: 'The operator has not been able to read the node of node-b in
          my-cluster for 10 minutes. What is not read is not known: no other node
          is touched while it lasts.'
        summary: talos-operator cannot read node-b.
      exp_labels:
        machine: node-b
        namespace: talos-operator
        severity: warning
        taloscluster: my-cluster
    - exp_annotations:
        description: 'The operator has not been able to read the node of node-c in
          my-cluster for 10 minutes. What is not read is not known: no other node
          is touched while it lasts.'
        summary: talos-operator cannot read node-c.
      exp_labels:
        machine: node-c
        namespace: talos-operator
        severity: warning
        taloscluster: my-cluster
    - exp_annotations:
        description: 'The operator has not been able to read the node of node-d in
          my-cluster for 10 minutes. What is not read is not known: no other node
          is touched while it lasts.'
        summary: talos-operator cannot read node-d.
      exp_labels:
        machine: node-d
        namespace: talos-operator
        severity: warning
        taloscluster: my-cluster
  - alertname: TalosMachineNotReady
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosControlPlaneNotEtcdVoter
    eval_time: 2h
    exp_alerts: []
  - alertname: TalosServiceUnhealthy
    eval_time: 2h
    exp_alerts: []
