# The talos.dev ServiceAccount CRD as Talos installs it once a KubeTalosAPIAccessConfig is active
# (internal/app/machined/pkg/controllers/k8s/manifest.go:264 in Talos v1.14). envtest has no
# Talos, so specs install it themselves and play Talos's part by writing the issued Secret.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceaccounts.talos.dev
spec:
  group: talos.dev
  names:
    kind: ServiceAccount
    listKind: ServiceAccountList
    plural: serviceaccounts
    shortNames: [tsa]
    singular: serviceaccount
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                roles:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                failureReason:
                  type: string
