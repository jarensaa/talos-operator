# Lets a pull request from Dependabot merge by itself once every required check has passed.
#
# This is the one job that runs on a pull request with a token that may write. It is safe to
# because it runs nothing from the pull request: no checkout, no build, only a question about the
# pull request and a request to GitHub to merge it when the checks are green. It runs for pull
# requests Dependabot opened in this repository and for no others; a pull request from a fork gets
# a read-only token whatever a workflow asks for. There is still no pull_request_target and no
# stored secret here.
#
# What merges by itself (docs/dev/dependencies.md): every bump whose checks pass, of a Go module,
# a GitHub Action or the release tooling, whatever its size. The checks are the judge: the unit
# tests, the linter, the image and chart, and the e2e on a cluster.
#
# One kind waits for a person: a new minor or major of the Talos libraries (machinery,
# go-kubernetes, the COSI runtime). The checks cannot judge it. It is a new Talos to support:
# the operator would start saying it knows a Talos release that no test here has run.
#
# A merge made with the workflow's own token starts no workflow on main, so nothing is tested
# again, released or published by it. The checks ran on the pull request, on top of main as it
# was; the release comes with the next merge a person makes.
name: Dependabot merge

on:
  pull_request:

permissions: {}

jobs:
  merge:
    name: Merge when the checks pass
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'jarensaa/talos-operator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Fails when a commit of the pull request is not Dependabot's own.
      - id: bump
        uses: dependabot/fetch-metadata@v3

      - name: Merge by itself, or wait for a person
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.head_ref }}
          UPDATE: ${{ steps.bump.outputs.update-type }}
          NAMES: ${{ steps.bump.outputs.dependency-names }}
        run: |
          # A pull request Dependabot rebuilt may have been one that merges by itself before.
          wait_for_a_person() {
            gh pr merge --disable-auto "$PR_URL" || true
            echo "Waits for a person: $1." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # Anything this does not recognise waits, an update without a type included.
          case "$BRANCH" in
            dependabot/go_modules/* | dependabot/github_actions/* | dependabot/npm_and_yarn/*) ;;
            *) wait_for_a_person "$BRANCH is no branch of Dependabot's that is known here" ;;
          esac

          case "$UPDATE" in
            version-update:semver-patch) ;;
            version-update:semver-minor | version-update:semver-major)
              case "$NAMES" in
                *github.com/siderolabs/* | *github.com/cosi-project/*)
                  wait_for_a_person "$UPDATE of the Talos libraries ($NAMES) is a new Talos to support"
                  ;;
              esac
              ;;
            *) wait_for_a_person "${UPDATE:-an update of no known type} on $BRANCH" ;;
          esac

          gh pr merge --auto --merge "$PR_URL"
          echo "Merges once the required checks pass: $UPDATE on $BRANCH." >> "$GITHUB_STEP_SUMMARY"
