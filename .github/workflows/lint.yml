name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Caches are written from main only (see test.yml).
          skip-save-cache: ${{ github.event_name == 'pull_request' }}
