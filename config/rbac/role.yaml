---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - get
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - talos.dev
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
  - update
- apiGroups:
  - talos.jarensaa.github.io
  resources:
  - talosclusters
  - talosmachineconfigs
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - talos.jarensaa.github.io
  resources:
  - talosclusters/finalizers
  - talosmachineconfigs/finalizers
  - talosmachinepools/finalizers
  - talosmachines/finalizers
  verbs:
  - update
- apiGroups:
  - talos.jarensaa.github.io
  resources:
  - talosclusters/status
  - talosmachineconfigs/status
  - talosmachinepools/status
  - talosmachines/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - talos.jarensaa.github.io
  resources:
  - talosmachinepools
  - talosmachines
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
